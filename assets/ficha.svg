<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d16"/>
      <stop offset="1" stop-color="#1e0f14"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a0b1f"/>
      <stop offset="1" stop-color="#ff4d5e"/>
    </linearGradient>
    <linearGradient id="xp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8892e"/>
      <stop offset="1" stop-color="#f4d27a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="xpClip"><rect x="40" y="290" width="533" height="14" rx="7"/></clipPath>
  </defs>
  <style>
    .t  { font-family: Georgia, 'Times New Roman', serif; }
    .m  { font-family: 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

    .mon { animation: spin 24s linear infinite; transform-origin: 110px 120px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fill { transform: scaleX(0); transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .d1 { animation-delay: .3s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .7s; }
    .d4 { animation-delay: .9s; } .d5 { animation-delay: 1.1s; } .d6 { animation-delay: 1.4s; }

    .sheen { animation: sheen 3s ease-in-out 2.8s infinite; }
    @keyframes sheen { from { transform: translateX(-120px); } to { transform: translateX(560px); } }

    .num { opacity: 0; animation: fade .6s ease-out 1.6s forwards; }
  </style>

  <!-- moldura -->
  <rect x="1" y="1" width="898" height="338" rx="10" fill="url(#bg)" stroke="#3a2229" stroke-width="2"/>
  <g stroke="#c8102e" stroke-width="3" fill="none">
    <path d="M14 40 V14 H40"/><path d="M860 14 H886 V40"/>
    <path d="M14 300 V326 H40"/><path d="M886 300 V326 H860"/>
  </g>

  <!-- título -->
  <text class="t" x="450" y="40" text-anchor="middle" font-size="22" fill="#f5f0e8" letter-spacing="6">FICHA DO SAMURAI</text>
  <line x1="350" y1="52" x2="550" y2="52" stroke="#c8102e" stroke-width="2"/>

  <!-- brasão (mon) -->
  <g class="mon">
    <circle cx="110" cy="120" r="52" fill="none" stroke="#c8102e" stroke-width="3"/>
    <circle cx="110" cy="120" r="44" fill="none" stroke="#c8102e" stroke-width="1" stroke-dasharray="4 6"/>
  </g>
  <circle cx="110" cy="120" r="38" fill="#1a0b10"/>
  <text x="110" y="136" text-anchor="middle" font-family="serif" font-size="44" fill="#f5f0e8">侍</text>

  <!-- dados do personagem -->
  <g class="m" font-size="15">
    <g class="fade" style="animation-delay:.2s">
      <text x="185" y="92"  fill="#8b7f86">NOME</text>
      <text x="270" y="92"  fill="#f5f0e8">João Wyctor</text>
    </g>
    <g class="fade" style="animation-delay:.4s">
      <text x="185" y="120" fill="#8b7f86">CLASSE</text>
      <text x="270" y="120" fill="#f5f0e8">Ronin de TI</text>
    </g>
    <g class="fade" style="animation-delay:.6s">
      <text x="185" y="148" fill="#8b7f86">CLÃ</text>
      <text x="270" y="148" fill="#f5f0e8">ADS (em treinamento)</text>
    </g>
    <g class="fade" style="animation-delay:.8s">
      <text x="185" y="176" fill="#8b7f86">ORIGEM</text>
      <text x="270" y="176" fill="#f5f0e8">3 anos atendimento</text>
      <text x="270" y="196" fill="#f5f0e8">2 anos produção</text>
    </g>
    <g class="fade" style="animation-delay:1s">
      <text x="185" y="224" fill="#8b7f86">MISSÃO</text>
      <text x="270" y="224" fill="#ff5a5a">1ª oportunidade em TI</text>
    </g>
  </g>

  <!-- divisória -->
  <line x1="490" y1="78" x2="490" y2="240" stroke="#3a2229" stroke-width="2"/>

  <!-- atributos -->
  <g class="m" font-size="14" fill="#d9cfc1">
    <text x="520" y="88">DISCIPLINA</text>
    <rect x="680" y="76" width="150" height="12" rx="6" fill="#2a1a20"/>
    <rect class="fill d1" x="680" y="76" width="135" height="12" rx="6" fill="url(#bar)"/>
    <text class="num" x="842" y="88" fill="#f5f0e8">90</text>

    <text x="520" y="120">PERSISTÊNCIA</text>
    <rect x="680" y="108" width="150" height="12" rx="6" fill="#2a1a20"/>
    <rect class="fill d2" x="680" y="108" width="132" height="12" rx="6" fill="url(#bar)"/>
    <text class="num" x="842" y="120" fill="#f5f0e8">88</text>

    <text x="520" y="152">ORGANIZAÇÃO</text>
    <rect x="680" y="140" width="150" height="12" rx="6" fill="#2a1a20"/>
    <rect class="fill d3" x="680" y="140" width="128" height="12" rx="6" fill="url(#bar)"/>
    <text class="num" x="842" y="152" fill="#f5f0e8">85</text>

    <text x="520" y="184">COOPERAÇÃO</text>
    <rect x="680" y="172" width="150" height="12" rx="6" fill="#2a1a20"/>
    <rect class="fill d4" x="680" y="172" width="123" height="12" rx="6" fill="url(#bar)"/>
    <text class="num" x="842" y="184" fill="#f5f0e8">82</text>

    <text x="520" y="216">ADAPTABILIDADE</text>
    <rect x="680" y="204" width="150" height="12" rx="6" fill="#2a1a20"/>
    <rect class="fill d5" x="680" y="204" width="120" height="12" rx="6" fill="url(#bar)"/>
    <text class="num" x="842" y="216" fill="#f5f0e8">80</text>
  </g>

  <!-- barra de XP -->
  <text class="m" x="40" y="278" font-size="14" fill="#f4d27a">XP · RUMO À PRIMEIRA MISSÃO</text>
  <text class="m" x="860" y="278" font-size="14" fill="#f4d27a" text-anchor="end">LV 1 · 65%</text>
  <rect x="40" y="290" width="820" height="14" rx="7" fill="#2a1a20"/>
  <rect class="fill d6" x="40" y="290" width="533" height="14" rx="7" fill="url(#xp)"/>
  <g clip-path="url(#xpClip)">
    <rect class="sheen" x="40" y="290" width="80" height="14" fill="url(#sheen)"/>
  </g>
</svg>
