<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 50" width="700" height="50">
  <style>
    text { font-family: 'Courier New', monospace; font-size: 20px; fill: #ff5a5a; }
    .l { opacity: 0; clip-path: inset(0 100% 0 0); animation: type 16s steps(40) infinite; }
    .l2 { animation-delay: 4s; } .l3 { animation-delay: 8s; } .l4 { animation-delay: 12s; }
    @keyframes type {
      0%   { opacity: 1; clip-path: inset(0 100% 0 0); }
      10%  { clip-path: inset(0 0 0 0); }
      22%  { opacity: 1; clip-path: inset(0 0 0 0); }
      25%,100% { opacity: 0; }
    }
    .cur { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g text-anchor="middle">
    <text class="l"    x="350" y="32">&gt; Estudante de Análise e Desenvolvimento de Sistemas</text>
    <text class="l l2" x="350" y="32">&gt; Front-end · Banco de Dados · Lógica</text>
    <text class="l l3" x="350" y="32">&gt; Certificado AI-900 — Fundamentos de IA no Azure</text>
    <text class="l l4" x="350" y="32">&gt; Em busca da primeira missão em TI</text>
  </g>
</svg>
