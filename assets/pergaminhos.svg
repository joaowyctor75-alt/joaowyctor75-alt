<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270">
  <style>
    .paper { transform: scaleX(0); transform-box: fill-box; transform-origin: center; animation: unroll 1.1s ease-in-out forwards; }
    @keyframes unroll { to { transform: scaleX(1); } }
    .rl { transform: translateX(var(--dx)); animation: back 1.1s ease-in-out forwards; }
    .rr { transform: translateX(calc(var(--dx) * -1)); animation: back 1.1s ease-in-out forwards; }
    @keyframes back { to { transform: translateX(0); } }
    .txt { opacity: 0; animation: fade .7s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    .seal { opacity: 0; transform-box: fill-box; transform-origin: center; animation: stamp .45s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes stamp { 0% { opacity: 0; transform: scale(2.2) rotate(-12deg); } 100% { opacity: 1; transform: scale(1) rotate(-6deg); } }
  </style>
  <rect x="1" y="1" width="898" height="268" rx="10" fill="#120d16" stroke="#3a2229" stroke-width="2"/>
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#f5f0e8" letter-spacing="6">PERGAMINHOS</text>
  <line x1="360" y1="52" x2="540" y2="52" stroke="#c8102e" stroke-width="2"/>
