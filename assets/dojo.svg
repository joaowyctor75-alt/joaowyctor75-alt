<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <style>
    .kl { transform-origin: 450px 62px; animation: kl 1s cubic-bezier(.2,1.3,.4,1) .2s both; }
    .kr { transform-origin: 450px 62px; animation: kr 1s cubic-bezier(.2,1.3,.4,1) .2s both; }
    @keyframes kl { from { transform: translateX(-260px) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes kr { from { transform: translateX(260px) rotate(30deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .spark { transform-box: fill-box; transform-origin: center; opacity: 0; animation: spark 3s ease-out 1.1s infinite; }
    @keyframes spark { 0% { opacity: 1; transform: scale(.3); } 25% { opacity: 0; transform: scale(2.2); } 100% { opacity: 0; } }
    .txt { opacity: 0; animation: fade .8s ease-out 1.1s forwards; }
    @keyframes fade { to { opacity: 1; } }
  </style>
  <rect x="1" y="1" width="898" height="118" rx="10" fill="#120d16" stroke="#3a2229" stroke-width="2"/>

  <!-- katanas cruzadas -->
  <g class="kl">
    <line x1="380" y1="100" x2="520" y2="24" stroke="#e8ecf1" stroke-width="3" stroke-linecap="round"/>
    <rect x="368" y="98" width="22" height="7" rx="2" fill="#2b1a20" stroke="#c8102e" transform="rotate(-28 379 101)"/>
  </g>
  <g class="kr">
    <line x1="520" y1="100" x2="380" y2="24" stroke="#e8ecf1" stroke-width="3" stroke-linecap="round"/>
    <rect x="510" y="98" width="22" height="7" rx="2" fill="#2b1a20" stroke="#c8102e" transform="rotate(28 521 101)"/>
  </g>
  <g class="spark">
    <path d="M450 48 L454 58 L464 62 L454 66 L450 76 L446 66 L436 62 L446 58 Z" fill="#f4d27a"/>
  </g>

  <g class="txt" font-family="Georgia, 'Times New Roman', serif">
    <text x="190" y="58" text-anchor="middle" font-size="26" fill="#f5f0e8" letter-spacing="8">DOJO</text>
    <text x="190" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#a8998f">treino diário</text>
    <text x="710" y="58" text-anchor="middle" font-size="18" fill="#f5f0e8" letter-spacing="4">道場</text>
    <text x="710" y="84" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#a8998f">estatísticas ao vivo</text>
  </g>
</svg>
