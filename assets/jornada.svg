<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290">
  <style>
    .t { font-family: Georgia, 'Times New Roman', serif; }
    .m { font-family: 'Courier New', monospace; }
    .road { stroke-dasharray: 800; stroke-dashoffset: 800; animation: draw 3.2s ease-in-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .node { opacity: 0; animation: pop .6s cubic-bezier(.3,1.6,.5,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 2s ease-out 3.4s infinite; opacity: 0; }
    @keyframes halo { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
    .ember { opacity: 0; animation: show .1s linear 3.6s forwards; }
    @keyframes show { to { opacity: 1; } }
  </style>
  <rect x="1" y="1" width="898" height="288" rx="10" fill="#120d16" stroke="#3a2229" stroke-width="2"/>
  <text class="t" x="450" y="40" text-anchor="middle" font-size="22" fill="#f5f0e8" letter-spacing="6">JORNADA</text>
  <line x1="375" y1="52" x2="525" y2="52" stroke="#c8102e" stroke-width="2"/>

  <path d="M110 170 C 195 170 195 125 280 125 C 365 125 365 170 450 170 C 535 170 535 125 620 125 C 705 125 705 155 790 155" fill="none" stroke="#2a1a20" stroke-width="8" stroke-linecap="round"/>
  <path class="road" d="M110 170 C 195 170 195 125 280 125 C 365 125 365 170 450 170 C 535 170 535 125 620 125 C 705 125 705 155 790 155" fill="none" stroke="#c8102e" stroke-width="3" stroke-linecap="round" stroke-dasharray="800"/>
  <path d="M110 170 C 195 170 195 125 280 125 C 365 125 365 170 450 170 C 535 170 535 125 620 125 C 705 125 705 155 790 155" fill="none" stroke="#f5f0e8" stroke-width="1" stroke-dasharray="2 10" opacity="0.35"/>

  <g class="ember">
    <circle r="5" fill="#ffb347">
      <animateMotion dur="6s" repeatCount="indefinite" path="M110 170 C 195 170 195 125 280 125 C 365 125 365 170 450 170 C 535 170 535 125 620 125 C 705 125 705 155 790 155"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g class="node" style="animation-delay:0.4s">
    <circle cx="110" cy="170" r="22" fill="#1a1016" stroke="#c8102e" stroke-width="3"/>
    <text x="110" y="178" text-anchor="middle" font-family="serif" font-size="22" fill="#f5f0e8">一</text>
    <text class="t" x="110" y="218" text-anchor="middle" font-size="15" letter-spacing="2" fill="#f5f0e8">ATENDIMENTO</text>
    <text class="m" x="110" y="236" text-anchor="middle" font-size="12" fill="#a8998f">3 anos · comunicação</text>
  </g><g class="node" style="animation-delay:1.1s">
    <circle cx="280" cy="125" r="22" fill="#1a1016" stroke="#c8102e" stroke-width="3"/>
    <text x="280" y="133" text-anchor="middle" font-family="serif" font-size="22" fill="#f5f0e8">二</text>
    <text class="t" x="280" y="75" text-anchor="middle" font-size="15" letter-spacing="2" fill="#f5f0e8">PRODUÇÃO</text>
    <text class="m" x="280" y="93" text-anchor="middle" font-size="12" fill="#a8998f">2 anos · disciplina e equipe</text>
  </g><g class="node" style="animation-delay:1.8s">
    <circle cx="450" cy="170" r="22" fill="#1a1016" stroke="#c8102e" stroke-width="3"/>
    <text x="450" y="178" text-anchor="middle" font-family="serif" font-size="22" fill="#f5f0e8">三</text>
    <text class="t" x="450" y="218" text-anchor="middle" font-size="15" letter-spacing="2" fill="#f5f0e8">DOJO ADS</text>
    <text class="m" x="450" y="236" text-anchor="middle" font-size="12" fill="#a8998f">Análise e Desenv. de Sistemas</text>
  </g><g class="node" style="animation-delay:2.5s">
    <circle cx="620" cy="125" r="22" fill="#1a1016" stroke="#c8102e" stroke-width="3"/>
    <text x="620" y="133" text-anchor="middle" font-family="serif" font-size="22" fill="#f5f0e8">四</text>
    <text class="t" x="620" y="75" text-anchor="middle" font-size="15" letter-spacing="2" fill="#f5f0e8">PRIMEIRAS LÂMINAS</text>
    <text class="m" x="620" y="93" text-anchor="middle" font-size="12" fill="#a8998f">Front-end · BD · AI-900</text>
  </g><g class="node" style="animation-delay:3.2s">
    <circle class="halo" cx="790" cy="155" r="22" fill="none" stroke="#f4d27a" stroke-width="2"/><circle cx="790" cy="155" r="22" fill="#1a1016" stroke="#f4d27a" stroke-width="3"/>
    <text x="790" y="163" text-anchor="middle" font-family="serif" font-size="22" fill="#f4d27a">?</text>
    <text class="t" x="790" y="203" text-anchor="middle" font-size="15" letter-spacing="2" fill="#f4d27a">PRÓXIMA MISSÃO</text>
    <text class="m" x="790" y="221" text-anchor="middle" font-size="12" fill="#a8998f">1ª vaga em TI</text>
  </g>
</svg>